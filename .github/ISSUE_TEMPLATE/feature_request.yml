name: Feature request
description: Propose a verification capability or workflow improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap exists in verification / receipts / repair today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior; keep local-first constraints in mind
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints acknowledged
      options:
        - label: No required cloud backend / telemetry by default
          required: true
        - label: Does not invent unsupported Cursor plugin.json fields
          required: true
