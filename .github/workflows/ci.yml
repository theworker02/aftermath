name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:plugin
      - run: npm test
      - run: node dist/cli/index.js version
      - run: node dist/cli/index.js doctor
      - name: CLI smoke on example
        run: |
          node dist/cli/index.js verify --cwd examples/broken-project || true
          test -d examples/broken-project/.aftermath/runs
